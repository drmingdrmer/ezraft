[package]
name          = "ezraft"
version       = "0.2.2"
edition       = "2024"
authors       = ["Zhang Yanpo <drdr.xp@gmail.com>"]
categories    = ["algorithms", "asynchronous", "data-structures"]
description   = "A beginner-friendly Raft framework built on openraft"
documentation = "https://docs.rs/ezraft"
homepage      = "https://github.com/drmingdrmer/ezraft"
keywords      = ["raft", "consensus"]
license       = "MIT OR Apache-2.0"
readme        = "README.md"
repository    = "https://github.com/drmingdrmer/ezraft"

# Each example keeps its end-to-end test beside it, as `<example>_test.rs`, and
# the two tests share `harness.rs`. Auto-discovery would take all three for
# examples and fail to build them, so every example is declared below instead.
autoexamples = false

[dependencies]
# Pinned exactly: openraft is a pre-release series that breaks API between
# alphas, and this crate implements its storage, network and type-config
# traits. A caret requirement would let a downstream `cargo update` pull an
# incompatible alpha into a build of ezraft that never changed.
openraft = { version = "=0.10.0-alpha.33", features = ["serde", "type-alias"] }

# No default features: one of them is `http2`, which pulls in h2 0.3 through
# actix-http 3.x (still on `http` 0.2). h2 patched RUSTSEC-2026-0258 only in
# 0.4.16, so that path fails `cargo audit`. Raft traffic here is HTTP/1.1 over
# plain `http://`, and this crate uses none of the other default features, so
# dropping the whole set costs nothing.
actix-web   = { version = "4.0", default-features = false }
async-trait = { version = "0.1" }
derive_more = { version = "2.1.1", features = ["display"] }
futures     = { version = "0.3" }
reqwest     = { version = "0.12", features = ["json"] }
serde       = { version = "1.0.114", features = ["derive"] }
serde_json  = { version = "1.0.57" }
tokio       = { version = "1.39", default-features = false, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
chrono             = { version = "0.4" }
clap               = { version = "4.1.11", features = ["derive", "env"] }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3.3", features = ["env-filter"] }

[[example]]
name = "kvstore"
path = "examples/kvstore.rs"

[[example]]
name = "timestamp_oracle"
path = "examples/timestamp_oracle.rs"

[[test]]
name = "kvstore_example"
path = "examples/kvstore_test.rs"

[[test]]
name = "timestamp_oracle_example"
path = "examples/timestamp_oracle_test.rs"

[profile.release]
debug = 2
split-debuginfo = "packed"
